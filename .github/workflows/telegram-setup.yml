# Налаштування бота правок без локального запуску: токен береться з
# secrets і ніде не виводиться.
#   discover — теми й люди чату (до ввімкнення вебхука): thread_id і user_id.
#              Репо публічне, а лог запуску видно всім — тому discover
#              показує лише id і перші літери імен, без тексту повідомлень.
#   set      — увімкнути вебхук на https://babaka.shop/api/telegram/webhook
#   info     — стан вебхука
#   delete   — вимкнути вебхук (звіт у «Реклама» не зачіпає)
#   check-pat — чи приймає GitHub секрет EDITS_GH_PAT (лише код відповіді й
#              форма токена: тип, довжина, чи є пробіли/переноси; не значення)
name: Telegram setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: Що зробити
        type: choice
        options: [discover, info, set, delete, check-pat]
        default: discover

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Перевірка EDITS_GH_PAT
        if: inputs.action == 'check-pat'
        shell: bash
        env:
          PAT: ${{ secrets.EDITS_GH_PAT }}
        run: |
          {
            echo "## EDITS_GH_PAT"
            if [ -z "$PAT" ]; then echo "- секрет порожній або не знайдений"; exit 1; fi
            case "$PAT" in github_pat_*) kind="fine-grained";; ghp_*) kind="classic";; *) kind="невідомий префікс";; esac
            echo "- тип: $kind, довжина: ${#PAT}"
            if printf '%s' "$PAT" | grep -q '[[:space:]]'; then echo "- ⚠️ є пробіли або переноси рядка"; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PAT" https://api.github.com/repos/${{ github.repository }})
            echo "- GitHub API (репо): HTTP $code"
            git ls-remote "https://x-access-token:${PAT}@github.com/${{ github.repository }}" HEAD >/dev/null 2>&1 && echo "- git: ✅" || echo "- git: ❌"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - if: inputs.action != 'check-pat'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_EDITS_CHAT_ID: ${{ vars.TELEGRAM_EDITS_CHAT_ID || '-1004296608260' }}
          ACTION: ${{ inputs.action }}
        # shell: bash — це -o pipefail: без нього помилка скрипта ховалась за tee,
        # і запуск без токена виглядав зеленим.
        shell: bash
        run: node scripts/telegram-webhook.mjs "$ACTION" | tee -a "$GITHUB_STEP_SUMMARY"
